# Single source of truth for every run. Change values here, not in code.
# Decisions behind these values: docs/DECISIONS.md (D-numbers below).

seed: 13

paths:
  root: data                     # override with SAERAG_DATA=/shared/path on the cluster
  questions: data/questions      # D9: {dataset}_{split}.jsonl
  retrieval: data/retrieval      # {retriever}/{dataset}_{split}.jsonl
  generations: data/generations  # {condition}/{dataset}_{split}.jsonl
  labels: data/labels            # {variant}/{dataset}_{split}.jsonl
  features: data/features        # {model_tag}/L{layer}/{kind}_{dataset}_{split}.npy
  results: runs

model:                           # D1, confirmed 2026-10-29
  generator: google/gemma-3-4b-it  # gated: accept the licence on HF, then `hf auth login`
  tag: gemma3-4b-it
  sae_repo: google/gemma-scope-2-4b-it  # CC-BY-4.0, SAEs trained on the IT model
  sae_site: resid_post
  sae_l0: medium                 # small 10-20 / medium 30-60 / big 60-150 active features
  sae_widths: [16k, 262k]
  sae_layers: [9, 17, 22, 29]    # 25/50/65/85% of 34 layers: the subset Gemma Scope 2 recommends
  dense_layers: [4, 9, 13, 17, 22, 29]  # dense probe sweep (6 layers, as in the proposal)

generation:                      # D4
  max_new_tokens: 32
  temperature: 0.0
  batch_size: 64                 # HF backend / feature extraction; lower it if you hit OOM
  backend: vllm                  # vllm (fast, needs bf16 GPU) | hf (works everywhere)
  dtype: auto                    # auto = bf16 if the GPU supports it, else fp32 (never fp16 for Gemma 3)
  max_model_len: 4096            # RAG prompts are ~600 tokens

retrieval:                       # D2, D3
  corpus: wikipedia-dpr-100w
  bm25_index: wikipedia-dpr-100w # pyserini prebuilt
  top_k: 3
  hole_fetch_k: 100
  hole_fraction: 0.30
  hole_datasets: [nq, triviaqa, hotpotqa]
  dense:                         # D12, week 3
    encoder: intfloat/e5-base-v2
    subsample: 2000000

datasets:                        # D8: sizes are planning sizes from the proposal
  nq:        {train: 4000, val: 500, test: 1000}
  triviaqa:  {train: 4000, val: 500, test: 1000}
  popqa:     {test: 1000}
  hotpotqa:  {test: 1000}
  selfaware: {test: 500}

pilot:
  n: 500                         # drawn from nq + triviaqa train
  gate_min_class_share: 0.15

labels:                          # D7
  variants: [default, miss_as_retrieve]

operating_points:
  max_false_refusal: 0.10
